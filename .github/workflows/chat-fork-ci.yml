name: Chat Fork CI

on:
  push:
    branches: [codex/chat-trajectory-location-rc6]
  pull_request:
    branches: [codex/chat-trajectory-location-rc6]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DSH_TELEMETRY_DISABLED: "1"

jobs:
  fork-ci:
    name: fork-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build linked DSH libraries
        run: pnpm run build:lib
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Test Chat-maintained trajectory extension
        run: pnpm exec vitest run packages/client/ui-trajectory
